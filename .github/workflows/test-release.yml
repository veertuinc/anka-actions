# Checkout the release that was just published and run up and down from that commit.
# workflow_dispatch takes the same tag as an input. Do not pin an old tag here.
name: 'test-release'
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Full release tag to test. Example: v2.0.1'
        required: true
        type: string

jobs:

  action-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: ./up
        id: action-up
        with:
          gh-pat: ${{ secrets.VEERTU_GITHUB_SERVICE_USER_PAT }}
          template-id: '9690461a-02b5-412d-8778-dab4167743db'
          controller-url: ${{ secrets.CONTROLLER_URL }}
          controller-auth-cert: ${{ secrets.CONTROLLER_VEERTU_COM_CERT }}
          controller-auth-cert-key: ${{ secrets.CONTROLLER_VEERTU_COM_KEY }}
    outputs:
      action-id: ${{ steps.action-up.outputs.action-id }}

  inside_vm_job:
    needs: action-up
    runs-on: [ self-hosted, "${{ needs.action-up.outputs.action-id }}" ]
    steps:
      - name: Inside VM Job
        id: inside_vm_job
        run: |
          echo "running the actual job 1 on runner ${{ needs.action-up.outputs.action-id }}"
          echo "user: $USER"
          echo "home: $HOME"

  action_down:
    if: always()
    needs: [ action-up, inside_vm_job ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: ./down
        with:
          action-id: ${{ needs.action-up.outputs.action-id }}
          gh-pat: ${{ secrets.VEERTU_GITHUB_SERVICE_USER_PAT }}
          controller-url: ${{ secrets.CONTROLLER_URL }}
          controller-auth-cert: ${{ secrets.CONTROLLER_VEERTU_COM_CERT }}
          controller-auth-cert-key: ${{ secrets.CONTROLLER_VEERTU_COM_KEY }}
